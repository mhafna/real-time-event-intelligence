services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-local
    hostname: kafka-local

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-local:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-local:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - event-stack-net


  flink-jobmanager:
    image: flink:2.2.1-scala_2.12
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager

    ports:
      - "8081:8081"

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:ro

    networks:
      - event-stack-net

    depends_on:
      - kafka


  flink-taskmanager:
    image: flink:2.2.1-scala_2.12
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:ro

    networks:
      - event-stack-net

    depends_on:
      - flink-jobmanager


  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: clickhouse
    hostname: clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: event_intelligence
      CLICKHOUSE_USER: event_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse-data:/var/lib/clickhouse

    networks:
      - event-stack-net


  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    hostname: grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}

      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - event-stack-net

    depends_on:
      - clickhouse


volumes:
  kafka-data:
  clickhouse-data:
  grafana-data:


networks:
  event-stack-net:
    external: true
